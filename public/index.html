<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Web | R_hmt ofc</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================= TEMA NEO BRUTALISM (ASLI DARI ZIP LU) ================= */
        :root {
            --bg-body: #f4f4f0; /* Cream klasik Neo Brutalism */
            --bg-card: #ffffff;
            --black: #000000;
            
            /* Warna Aksen Bawaan */
            --primary-btn: #8b5cf6; /* Ungu/Indigo khas */
            --secondary-btn: #10b981; /* Hijau */
            --accent-yellow: #fcd34d;
            
            --border: 3px solid var(--black);
            --shadow: 5px 5px 0px var(--black);
            --shadow-hover: 2px 2px 0px var(--black);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(#d1d5db 2px, transparent 2px);
            background-size: 20px 20px;
            color: var(--black);
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--bg-card);
            border-bottom: var(--border);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-box {
            background: var(--primary-btn);
            color: var(--bg-card);
            border: var(--border);
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 3px 3px 0px var(--black);
            border-radius: 4px;
        }
        .nav-brand h1 { font-size: 24px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: -0.5px;}

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Card Generator */
        .neo-card {
            background: var(--bg-card);
            border: var(--border);
            box-shadow: var(--shadow);
            padding: 30px;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px dashed var(--black);
        }
        .badge {
            background: var(--black);
            color: var(--bg-card);
            padding: 5px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 12px;
            border-radius: 4px;
        }

        /* Form Layout */
        .form-group { margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;}

        label {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* Input Styles */
        .input-box {
            display: flex;
            align-items: center;
            border: var(--border);
            background: var(--bg-body);
            height: 50px;
            border-radius: 6px;
            transition: 0.2s;
            overflow: hidden;
        }
        .input-box:focus-within {
            background: var(--bg-card);
            box-shadow: 4px 4px 0px var(--primary-btn);
            transform: translate(-2px, -2px);
        }
        .input-box i { padding: 0 15px; font-size: 18px; border-right: var(--border); }
        
        input[type="url"], input[type="number"], select {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            padding: 0 15px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            color: var(--black);
            appearance: none;
        }

        .unit {
            padding: 0 15px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            border-left: var(--border);
            background: var(--bg-card);
        }

        /* Select Dropdown */
        .select-box {
            position: relative;
            border: var(--border);
            background: var(--bg-card);
            height: 50px;
            border-radius: 6px;
            display: flex;
            align-items: center;
        }
        .select-box i {
            position: absolute;
            right: 15px;
            pointer-events: none;
            font-size: 20px;
        }

        /* Switch Toggle (Full Page) */
        .fullpage-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: var(--border);
            border-radius: 6px;
            height: 50px;
            padding: 0 15px;
        }
        .neo-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .neo-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-body); border: 2px solid var(--black); border-radius: 34px; transition: .2s; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: var(--black); border-radius: 50%; transition: .2s; }
        input:checked + .slider { background-color: var(--primary-btn); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--bg-card); }

        /* Buttons */
        .btn-neo {
            width: 100%;
            height: 55px;
            border: var(--border);
            background: var(--primary-btn);
            color: var(--bg-card);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-radius: 6px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .btn-neo:hover {
            transform: translate(3px, 3px);
            box-shadow: var(--shadow-hover);
        }
        .btn-neo:disabled { background: #d1d5db; color: #6b7280; box-shadow: none; transform: none; cursor: not-allowed; }

        .download-btn {
            background: var(--secondary-btn);
            color: var(--bg-card);
            margin-top: 20px;
        }

        .loader {
            width: 20px; height: 20px;
            border: 3px solid var(--bg-card); border-top-color: transparent;
            border-radius: 50%; animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Preview Area */
        #result-area { display: none; margin-top: 35px; }
        .divider {
            text-align: center; margin-bottom: 25px; font-weight: 800; position: relative;
        }
        .divider::before {
            content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 3px dashed var(--black); z-index: 1;
        }
        .divider span {
            background: var(--bg-card); padding: 5px 20px; position: relative; z-index: 2; border: var(--border); font-size: 13px; border-radius: 20px;
        }

        .preview-window { border: var(--border); background: var(--bg-card); border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--shadow); }
        .window-bar { background: var(--black); padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        .circles { display: flex; gap: 6px; }
        .c { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--black); }
        .c.red { background: #ff5f56; } .c.yellow { background: #ffbd2e; } .c.green { background: #27c93f; }
        .address-bar { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--bg-body); background: #333; padding: 4px 10px; border-radius: 4px; text-align: center; }
        
        .img-container { padding: 15px; background: var(--bg-body); text-align: center; }
        .img-container img { max-width: 100%; border: var(--border); border-radius: 4px; }

        /* Footer */
        .main-footer { text-align: center; margin-top: 40px; padding-bottom: 50px; }
        .powered-by { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
        
        .join-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--accent-yellow); color: var(--black);
            padding: 12px 25px; border: var(--border); border-radius: 6px;
            font-weight: 800; text-decoration: none; box-shadow: var(--shadow);
            transition: 0.2s; margin-bottom: 25px; font-size: 13px;
        }
        .join-btn:hover { transform: translate(2px, 2px); box-shadow: var(--shadow-hover); }

        .social-icons { display: flex; justify-content: center; gap: 25px; font-size: 26px; }
        .social-icons a { color: var(--black); text-decoration: none; transition: 0.2s; }
        .social-icons a:hover { color: var(--primary-btn); transform: translateY(-3px); }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .container { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <div class="logo-box">
                <i class="ri-camera-lens-fill"></i>
            </div>
            <h1>SCREENSHOT WEB</h1>
        </div>
    </nav>

    <main class="container">
        <section id="generator" class="neo-card">
            <div class="card-top">
                <span class="badge">REC</span>
                <span style="font-weight: 800; font-size: 14px;">LIVE CAPTURE SYSTEM</span>
            </div>
            
            <form id="ss-form">
                <div class="form-group">
                    <label>TARGET URL</label>
                    <div class="input-box">
                        <i class="ri-link"></i>
                        <input type="url" id="url" placeholder="https://domain-target.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>PILIH RESOLUSI</label>
                    <div class="select-box">
                        <select id="device-preset" style="padding-left: 15px;">
                            <option value="phone">Mobile (375 x 812)</option>
                            <option value="tablet">Tablet (768 x 1024)</option>
                            <option value="laptop">Laptop (1366 x 768)</option>
                            <option value="pcfhd" selected>PC FHD (1920 x 1080)</option>
                            <option value="pc4k">PC 4K (3840 x 2160)</option>
                            <option value="custom">Custom (Atur Manual)</option>
                        </select>
                        <i class="ri-arrow-down-s-line"></i>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>VIEWPORT WIDTH</label>
                        <div class="input-box">
                            <input type="number" id="width" value="1920">
                            <span class="unit">PX</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>VIEWPORT HEIGHT</label>
                        <div class="input-box">
                            <input type="number" id="height" value="1080">
                            <span class="unit">PX</span>
                        </div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>RENDER SCALE</label>
                        <div class="select-box">
                            <select id="scale" style="padding-left: 15px;">
                                <option value="1">1x (Standard)</option>
                                <option value="2">2x (Retina HD)</option>
                                <option value="3">3x (Ultra 4K)</option>
                            </select>
                            <i class="ri-arrow-down-s-line"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>FULL PAGE MODE</label>
                        <div class="fullpage-box">
                            <span style="font-size: 13px; font-weight: 800;">AKTIFKAN</span>
                            <label class="neo-switch">
                                <input type="checkbox" id="fullpage">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-neo">
                    <span id="btn-text">AMBIL SCREENSHOT</span>
                    <i class="ri-focus-3-line" id="btn-icon"></i>
                    <div class="loader" id="loader"></div>
                </button>
            </form>

            <div id="result-area">
                <div class="divider"><span>HASIL CAPTURE</span></div>
                
                <div class="preview-window">
                    <div class="window-bar">
                        <div class="circles">
                            <span class="c red"></span>
                            <span class="c yellow"></span>
                            <span class="c green"></span>
                        </div>
                        <div class="address-bar">capture_result.png</div>
                    </div>
                    <div class="img-container">
                        <img id="result-img" src="" alt="Result">
                    </div>
                </div>

                <button id="download-btn" class="btn-neo download-btn">
                    <i class="ri-download-cloud-2-fill"></i> SIMPAN GAMBAR
                </button>
            </div>
        </section>

        <footer class="main-footer">
            <div class="powered-by">POWERED BY <span style="font-weight: 800;">R_hmt ofc</span></div>
            
            <a href="https://whatsapp.com/channel/0029VbBjyjlJ93wa6hwSWa0p" target="_blank" class="join-btn">
                <i class="ri-whatsapp-fill" style="font-size: 18px;"></i> JOIN SALURAN WHATSAPP
            </a>

            <div class="social-icons">
                <a href="https://www.instagram.com/rahmt_nhw?igsh=MWQwcnB3bTA2ZnVidg==" target="_blank"><i class="ri-instagram-fill"></i></a>
                <a href="https://www.tiktok.com/@r_hmtofc?_r=1&_t=ZS-94KRfWQjeUu" target="_blank"><i class="ri-tiktok-fill"></i></a>
                <a href="https://t.me/rAi_engine" target="_blank"><i class="ri-telegram-fill"></i></a>
            </div>
        </footer>
    </main>

    <script>
        // ================= JAVASCRIPT SECTION =================
        const API_URL = '/api/screenshot';

        // --- Logika Dropdown Resolusi ---
        const presetSelect = document.getElementById('device-preset');
        const wInput = document.getElementById('width');
        const hInput = document.getElementById('height');

        const deviceSizes = {
            phone: { w: 375, h: 812 },
            tablet: { w: 768, h: 1024 },
            laptop: { w: 1366, h: 768 },
            pcfhd: { w: 1920, h: 1080 },
            pc4k: { w: 3840, h: 2160 }
        };

        presetSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val !== 'custom' && deviceSizes[val]) {
                wInput.value = deviceSizes[val].w;
                hInput.value = deviceSizes[val].h;
            }
        });

        // Set ke Custom otomatis kalau ngetik angka manual
        const setCustom = () => presetSelect.value = 'custom';
        wInput.addEventListener('input', setCustom);
        hInput.addEventListener('input', setCustom);

        // --- Logika Core Capture ---
        const form = document.getElementById('ss-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('result-area');
        const resultImg = document.getElementById('result-img');
        const downloadBtn = document.getElementById('download-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            btnText.textContent = 'MEMPROSES...';
            btnIcon.style.display = 'none';
            loader.style.display = 'block';
            resultArea.style.display = 'none';

            // Mengirim data ke backend (tanpa delay)
            const payload = {
                url: document.getElementById('url').value,
                width: parseInt(wInput.value) || 1280,
                height: parseInt(hInput.value) || 720,
                device_scale: parseInt(document.getElementById('scale').value) || 1,
                full_page: document.getElementById('fullpage').checked
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    resultImg.src = data.image_url;
                    resultArea.style.display = 'block';
                    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    alert('Gagal mengambil screenshot. Pastikan URL valid dan server tujuan tidak memblokir.');
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan koneksi ke server API.');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'AMBIL SCREENSHOT';
                btnIcon.style.display = 'block';
                loader.style.display = 'none';
            }
        });

        // --- LOGIKA DOWNLOAD (MEMAKAI API DOWNLOAD INTERNAL) ---
        downloadBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const imageUrl = resultImg.src;
            if(!imageUrl) return;

            const originalHTML = downloadBtn.innerHTML;
            downloadBtn.innerHTML = `<div class="loader" style="display:inline-block; border-color: white; border-top-color: transparent;"></div> SEDANG MENDOWNLOAD...`;
            
            try {
                // Fetch ke API lokal buatan sendiri agar terhindar dari CORS
                const response = await fetch(`/api/download?url=${encodeURIComponent(imageUrl)}`);
                
                if (!response.ok) throw new Error("Gagal mengambil gambar dari lokal API");

                const blob = await response.blob();
                const tempUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = tempUrl;
                a.download = `Capture_Rhmt_${new Date().getTime()}.png`;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                window.URL.revokeObjectURL(tempUrl);
            } catch (err) {
                console.error("Gagal mendownload otomatis, fallback ke tab baru:", err);
                window.open(imageUrl, '_blank');
            } finally {
                downloadBtn.innerHTML = originalHTML;
            }
        });
    </script>
</body>
</html>
