<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Capture Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ================= TEMA (HITAM, PUTIH, SOFT INDIGO) ================= */
        :root {
            --bg-base: #09090b; 
            --card-bg: #121214; 
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #6366f1; 
            --accent-hover: #818cf8;
            --border: #27272a;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: var(--bg-base);
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .header-brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-brand i {
            font-size: 32px;
            color: var(--accent);
        }

        .header-brand h1 {
            font-size: 18px;
            font-weight: 700;
            margin-top: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        input[type="url"], input[type="number"], select {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px 10px 36px;
            font-size: 13px;
            border-radius: 6px;
            outline: none;
            transition: 0.2s;
            height: 42px;
        }

        input[type="number"], select { padding-left: 12px; }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        /* ================= CUSTOM DROPDOWN (YANG LU MAU) ================= */
        .custom-dropdown {
            position: relative;
            width: 100%;
        }

        .dropdown-selected {
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 15px;
            height: 42px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-main);
            transition: 0.2s;
        }

        .dropdown-selected:hover {
            border-color: var(--accent);
        }

        .dropdown-options {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
        }

        /* Saat dropdown aktif, list muncul */
        .custom-dropdown.active .dropdown-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .custom-dropdown.active .dropdown-selected i {
            transform: rotate(180deg);
        }

        .dropdown-options li {
            padding: 12px 15px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-options li:last-child {
            border-bottom: none;
        }

        .dropdown-options li:hover, .dropdown-options li.selected {
            background: rgba(99, 102, 241, 0.1);
            color: var(--text-main);
        }
        
        .dropdown-options li i { font-size: 16px; color: var(--accent); }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .checkbox-wrapper input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            border: none;
            height: 44px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

        .loader {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #result-area {
            display: none;
            margin-top: 25px;
            border-top: 1px dashed var(--border);
            padding-top: 20px;
        }

        .img-container { 
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px; 
            background: var(--bg-base);
            text-align: center; 
        }
        .img-container img { max-width: 100%; display: block; border-radius: 4px; }

        .btn-success {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-success:hover { background: var(--border); }

        footer {
            margin-top: 30px;
            text-align: center;
            width: 100%;
            max-width: 440px;
        }

        .powered-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .powered-text strong {
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
        }

        .join-channel-box {
            margin-bottom: 20px;
        }
        
        .btn-join-saluran {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .btn-join-saluran:hover {
            background: var(--accent);
            color: #ffffff;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
        }
        .social-links a {
            color: var(--text-muted);
            font-size: 20px;
            text-decoration: none;
            transition: 0.2s;
        }
        .social-links a:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-brand">
            <i class="ri-camera-lens-fill"></i>
            <h1>Web Capture</h1>
        </div>

        <form id="ss-form">
            <div class="form-group">
                <label>URL TARGET</label>
                <div class="input-wrapper">
                    <i class="ri-link"></i>
                    <input type="url" id="url" placeholder="https://domain-target.com" required>
                </div>
            </div>

            <!-- CUSTOM DROPDOWN UI -->
            <div class="form-group">
                <label>PILIH PERANGKAT (RESOLUSI)</label>
                <div class="custom-dropdown" id="device-dropdown">
                    <!-- Bagian yang diklik -->
                    <div class="dropdown-selected" id="dropdown-selected">
                        <span id="dropdown-text"><i class="ri-computer-line" style="margin-right:8px; color:var(--accent);"></i>PC FHD (1920 x 1080)</span>
                        <i class="ri-arrow-down-s-line" style="transition:0.3s;"></i>
                    </div>
                    <!-- Daftar Opsi yang muncul -->
                    <ul class="dropdown-options" id="dropdown-options">
                        <li data-w="375" data-h="812"><i class="ri-smartphone-line"></i>Mobile (375 x 812)</li>
                        <li data-w="768" data-h="1024"><i class="ri-tablet-line"></i>Tablet (768 x 1024)</li>
                        <li data-w="1366" data-h="768"><i class="ri-macbook-line"></i>Laptop (1366 x 768)</li>
                        <li data-w="1920" data-h="1080" class="selected"><i class="ri-computer-line"></i>PC FHD (1920 x 1080)</li>
                        <li data-w="3840" data-h="2160"><i class="ri-tv-2-line"></i>PC 4K (3840 x 2160)</li>
                        <li data-w="custom" data-h="custom"><i class="ri-settings-4-line"></i>Custom (Atur Manual)</li>
                    </ul>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>LEBAR (PX)</label>
                    <input type="number" id="width" value="1920" required>
                </div>
                <div class="form-group">
                    <label>TINGGI (PX)</label>
                    <input type="number" id="height" value="1080" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>RENDER SCALE</label>
                    <div class="input-wrapper" style="position:relative;">
                        <select id="scale" style="appearance:none; padding-left:15px;">
                            <option value="1">1x (Standar)</option>
                            <option value="2">2x (Retina HD)</option>
                        </select>
                        <i class="ri-arrow-down-s-line" style="left:auto; right:12px;"></i>
                    </div>
                </div>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="fullpage">
                    <span>Full Page Mode</span>
                </label>
            </div>

            <button type="submit" id="submit-btn" class="btn">
                <span id="btn-text">AMBIL GAMBAR</span>
                <i class="ri-focus-3-line" id="btn-icon"></i>
                <div class="loader" id="loader"></div>
            </button>
        </form>

        <div id="result-area">
            <div class="img-container">
                <img id="result-img" src="" alt="Hasil Render">
            </div>
            <button id="download-btn" class="btn btn-success">
                <i class="ri-download-cloud-2-line"></i> SIMPAN GAMBAR
            </button>
        </div>
    </div>

    <footer>
        <div class="powered-text">
            POWERED BY<br>
            <strong>R_hmt ofc</strong>
        </div>

        <div class="join-channel-box">
            <a href="https://whatsapp.com/channel/0029VbBjyjlJ93wa6hwSWa0p" target="_blank" class="btn-join-saluran">
                <i class="ri-whatsapp-line"></i> JOIN SALURAN WHATSAPP
            </a>
        </div>

        <div class="social-links">
            <a href="https://www.instagram.com/rahmt_nhw?igsh=MWQwcnB3bTA2ZnVidg==" target="_blank"><i class="ri-instagram-line"></i></a>
            <a href="https://www.tiktok.com/@r_hmtofc?_r=1&_t=ZS-94KRfWQjeUu" target="_blank"><i class="ri-tiktok-line"></i></a>
            <a href="https://t.me/rAi_engine" target="_blank"><i class="ri-telegram-line"></i></a>
        </div>
    </footer>

    <script>
        // ================= LOGIKA CUSTOM DROPDOWN =================
        const dropdown = document.getElementById('device-dropdown');
        const dropdownSelected = document.getElementById('dropdown-selected');
        const dropdownText = document.getElementById('dropdown-text');
        const optionsList = document.querySelectorAll('.dropdown-options li');
        const wInput = document.getElementById('width');
        const hInput = document.getElementById('height');

        // Buka tutup dropdown kalau diklik
        dropdownSelected.addEventListener('click', () => {
            dropdown.classList.toggle('active');
        });

        // Tutup dropdown kalau klik di luar kotak
        document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target)) {
                dropdown.classList.remove('active');
            }
        });

        // Event saat opsi dipilih
        optionsList.forEach(option => {
            option.addEventListener('click', () => {
                // Hapus class selected di list yang lain
                optionsList.forEach(li => li.classList.remove('selected'));
                option.classList.add('selected');

                // Ubah teks di tombol
                dropdownText.innerHTML = option.innerHTML;

                // Ambil ukuran dari data attribute
                const w = option.getAttribute('data-w');
                const h = option.getAttribute('data-h');

                if (w !== 'custom') {
                    wInput.value = w;
                    hInput.value = h;
                }

                // Tutup dropdown
                dropdown.classList.remove('active');
            });
        });

        // Kalau isi input manual, set dropdown ke Custom otomatis
        const setCustom = () => {
            optionsList.forEach(li => li.classList.remove('selected'));
            const customOption = document.querySelector('li[data-w="custom"]');
            customOption.classList.add('selected');
            dropdownText.innerHTML = customOption.innerHTML;
        };
        wInput.addEventListener('input', setCustom);
        hInput.addEventListener('input', setCustom);


        // ================= LOGIKA API CAPTURE =================
        const API_URL = '/api/screenshot';
        const form = document.getElementById('ss-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('result-area');
        const resultImg = document.getElementById('result-img');
        const downloadBtn = document.getElementById('download-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            btnText.textContent = 'MEMPROSES...';
            btnIcon.style.display = 'none';
            loader.style.display = 'block';
            resultArea.style.display = 'none';

            const payload = {
                url: document.getElementById('url').value,
                width: parseInt(wInput.value) || 1280,
                height: parseInt(hInput.value) || 720,
                device_scale: parseInt(document.getElementById('scale').value) || 1,
                full_page: document.getElementById('fullpage').checked
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    resultImg.src = data.image_url;
                    resultArea.style.display = 'block';
                    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    alert('Gagal: ' + (data.message || 'Coba lagi.'));
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan koneksi saat capture.');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'AMBIL GAMBAR';
                btnIcon.style.display = 'inline-block';
                loader.style.display = 'none';
            }
        });

        // ================= LOGIKA DOWNLOAD ASLI (TANPA PROXY) =================
        downloadBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const imageUrl = resultImg.src;
            if (!imageUrl) return;

            const originalHTML = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<div class="loader" style="display:inline-block; border-color: var(--text-main); border-top-color: transparent;"></div> MENDOWNLOAD...';
            
            try {
                // BALIK KE FUNGSI ASLI LU
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                const tempUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = tempUrl;
                a.download = `Capture-${new Date().getTime()}.png`;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(tempUrl);
            } catch (err) {
                console.error("Gagal auto-download, fallback ke tab baru", err);
                window.open(imageUrl, '_blank'); 
            } finally {
                downloadBtn.innerHTML = originalHTML;
            }
        });
    </script>
</body>
        </html>
