<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Capture Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ================= TEMA 3 WARNA (HITAM, PUTIH, KUNING) ================= */
        :root {
            --black: #000000;
            --white: #ffffff;
            --yellow: #ffd700;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif;
        }
        
        body {
            /* Background hitam dengan garis-garis diagonal putih transparan tipis */
            background: repeating-linear-gradient(
                45deg,
                #000000,
                #000000 8px,
                #0a0a0a 8px,
                #0a0a0a 16px
            );
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px; /* Lebar dibikin lebih padat */
            background: var(--black);
            border: 1px solid var(--white);
            padding: 25px 20px;
            box-shadow: 6px 6px 0px rgba(255, 255, 255, 0.1);
        }

        .header-brand {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--white);
            padding-bottom: 15px;
        }

        .header-brand i {
            font-size: 28px;
            color: var(--yellow);
        }

        .header-brand h1 {
            font-size: 18px;
            font-weight: 700;
            margin-top: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Form & Input - Dikecilin ukurannya */
        .form-group { margin-bottom: 12px; }

        label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--white);
            font-size: 14px;
        }

        input[type="url"], input[type="number"], select {
            width: 100%;
            background: var(--black);
            border: 1px solid var(--white);
            color: var(--yellow);
            padding: 8px 10px 8px 30px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            height: 34px; /* Tinggi di pres biar slim */
            transition: 0.2s;
        }

        input[type="number"], select { padding-left: 10px; }

        input:focus, select:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Fitur hint ukuran layar waktu diklik */
        #res-hint {
            display: none;
            font-size: 11px;
            color: var(--yellow);
            margin-top: 5px;
            font-weight: 600;
            animation: fadeIn 0.3s;
        }
        #res-hint i { margin-right: 4px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        .checkbox-wrapper input {
            accent-color: var(--yellow);
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        /* Tombol Utama */
        .btn {
            width: 100%;
            background: var(--white);
            color: var(--black);
            border: 1px solid var(--white);
            height: 38px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            transition: 0.2s;
        }

        .btn:hover { 
            background: var(--yellow); 
            border-color: var(--yellow);
        }
        
        .btn:disabled { 
            background: #222; 
            border-color: #222; 
            color: #555; 
            cursor: not-allowed; 
        }

        .loader {
            width: 14px;
            height: 14px;
            border: 2px solid var(--black);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Area Hasil Screenshot */
        #result-area {
            display: none;
            margin-top: 20px;
            border-top: 1px dashed var(--white);
            padding-top: 15px;
        }

        .img-container { 
            border: 1px solid var(--white);
            padding: 5px; 
            text-align: center; 
        }
        .img-container img { max-width: 100%; display: block; }

        .btn-success {
            background: var(--yellow);
            color: var(--black);
            border-color: var(--yellow);
        }

        /* ================= FOOTER ================= */
        footer {
            margin-top: 25px;
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        .powered-text {
            font-size: 10px;
            color: var(--white);
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .powered-text strong {
            color: var(--yellow);
            font-size: 11px;
        }

        /* Tombol Join Saluran (Kuning - Menonjol) */
        .join-channel-box {
            margin-bottom: 15px;
        }
        
        .btn-join-saluran {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--black);
            border: 1px solid var(--yellow);
            color: var(--yellow);
            padding: 8px 15px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            transition: 0.2s;
        }
        
        .btn-join-saluran:hover {
            background: var(--yellow);
            color: var(--black);
        }

        /* Icon Sosmed (Putih) */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social-links a {
            color: var(--white);
            font-size: 18px;
            text-decoration: none;
            transition: 0.2s;
        }
        .social-links a:hover { color: var(--yellow); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-brand">
            <i class="ri-camera-lens-fill"></i>
            <h1>Web Capture</h1>
        </div>

        <form id="ss-form">
            <div class="form-group">
                <label>URL TARGET</label>
                <div class="input-wrapper">
                    <i class="ri-link"></i>
                    <input type="url" id="url" placeholder="https://domain-target.com" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>LEBAR (PX)</label>
                    <input type="number" id="width" value="1280" required>
                </div>
                <div class="form-group">
                    <label>TINGGI (PX)</label>
                    <input type="number" id="height" value="720" required>
                </div>
            </div>
            
            <!-- Tempat Notifikasi Ukuran Layar Muncul -->
            <div id="res-hint"></div>

            <div class="grid-2" style="margin-top: 12px;">
                <div class="form-group">
                    <label>RENDER SCALE</label>
                    <select id="scale">
                        <option value="1">1x (Standar)</option>
                        <option value="2">2x (HD)</option>
                        <option value="3">3x (Ultra)</option>
                    </select>
                </div>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="fullpage">
                    <span>Full Page Capture</span>
                </label>
            </div>

            <button type="submit" id="submit-btn" class="btn">
                <span id="btn-text">AMBIL GAMBAR</span>
                <i class="ri-flashlight-line" id="btn-icon"></i>
                <div class="loader" id="loader"></div>
            </button>
        </form>

        <div id="result-area">
            <div class="img-container">
                <img id="result-img" src="" alt="Hasil Render">
            </div>
            <button id="download-btn" class="btn btn-success">
                <i class="ri-download-line"></i> SIMPAN GAMBAR
            </button>
        </div>
    </div>

    <footer>
        <!-- 1. Powered By -->
        <div class="powered-text">
            Powered by<br>
            <strong>✧･ﾟ: [𝙍]𝙝𝙢𝙏 | 𝘾𝙤𝙙𝙚⚙️𝘼𝙄 𝙡 :･ﾟ✧</strong>
        </div>

        <!-- 2. Tombol Join Saluran (Kuning/Beda Sendiri) -->
        <div class="join-channel-box">
            <a href="https://whatsapp.com/channel/0029VbBjyjlJ93wa6hwSWa0p" target="_blank" class="btn-join-saluran">
                <i class="ri-whatsapp-line"></i> JOIN SALURAN WHATSAPP
            </a>
        </div>

        <!-- 3. Icon Sosmed (Hitam/Putih) -->
        <div class="social-links">
            <a href="https://www.instagram.com/rahmt_nhw?igsh=MWQwcnB3bTA2ZnVidg==" target="_blank"><i class="ri-instagram-line"></i></a>
            <a href="https://www.tiktok.com/@r_hmtofc?_r=1&_t=ZS-94KRfWQjeUu" target="_blank"><i class="ri-tiktok-line"></i></a>
            <a href="https://t.me/rAi_engine" target="_blank"><i class="ri-telegram-line"></i></a>
        </div>
    </footer>

    <script>
        // ================= LOGIKA FITUR UKURAN (HINT RESOLUSI) =================
        const wInput = document.getElementById('width');
        const hInput = document.getElementById('height');
        const resHint = document.getElementById('res-hint');

        function updateResHint() {
            const w = parseInt(wInput.value) || 0;
            const h = parseInt(hInput.value) || 0;
            let icon = 'ri-computer-line';
            let text = 'Desktop/Tablet';
            
            if (w < 600) {
                icon = 'ri-smartphone-line'; text = 'Mobile Phone';
            } else if (w === 1280 && h === 720) {
                text = 'Desktop (HD)';
            } else if (w === 1920 && h === 1080) {
                text = 'Desktop (Full HD)';
            }

            resHint.innerHTML = `<i class="${icon}"></i> Ukuran = ${w} x ${h} (${text})`;
            resHint.style.display = 'block';
        }

        // Munculin teks waktu kolom diklik atau angkanya diganti
        wInput.addEventListener('focus', updateResHint);
        hInput.addEventListener('focus', updateResHint);
        wInput.addEventListener('input', updateResHint);
        hInput.addEventListener('input', updateResHint);

        // Hilangin teks kalau udah gak di-klik
        wInput.addEventListener('blur', () => resHint.style.display = 'none');
        hInput.addEventListener('blur', () => resHint.style.display = 'none');


        // ================= LOGIKA API CAPTURE (TETAP AMAN) =================
        const API_URL = '/api/screenshot';
        const form = document.getElementById('ss-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('result-area');
        const resultImg = document.getElementById('result-img');
        const downloadBtn = document.getElementById('download-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            btnText.textContent = 'MEMPROSES...';
            btnIcon.style.display = 'none';
            loader.style.display = 'block';
            resultArea.style.display = 'none';

            const payload = {
                url: document.getElementById('url').value,
                width: parseInt(wInput.value) || 1280,
                height: parseInt(hInput.value) || 720,
                device_scale: parseInt(document.getElementById('scale').value) || 1,
                full_page: document.getElementById('fullpage').checked
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    resultImg.src = data.image_url;
                    resultArea.style.display = 'block';
                    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    alert('Gagal: ' + (data.message || 'Coba lagi.'));
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan koneksi.');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'AMBIL GAMBAR';
                btnIcon.style.display = 'inline-block';
                loader.style.display = 'none';
            }
        });

        downloadBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const imageUrl = resultImg.src;
            
            const originalHTML = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<div class="loader" style="display:inline-block; border-color: #000; border-top-color: transparent;"></div>';
            
            try {
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                const tempUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = tempUrl;
                a.download = `capture-${new Date().getTime()}.png`;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(tempUrl);
            } catch (err) {
                console.error("Gagal auto-download", err);
                window.open(imageUrl, '_blank'); 
            } finally {
                downloadBtn.innerHTML = originalHTML;
            }
        });
    </script>
</body>
                    </html>
