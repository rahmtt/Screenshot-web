<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Capture Tool | R_hmt ofc</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ================= TEMA NEON CYBER (NO EMOJI) ================= */
        :root {
            --bg-black: #000000;
            --bg-card: #08080a;
            --text-main: #e4e4e7;
            --text-muted: #71717a;
            /* Warna Neon Pendekatan Baru: Soft Indigo */
            --glow-main: #6366f1; 
            --glow-dim: rgba(99, 102, 241, 0.2);
            --border-glow: rgba(99, 102, 241, 0.3);
            --bg-grid: #0f1115;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: var(--glow-dim); color: #fff; }

        body {
            background-color: var(--bg-black);
            /* UPGRADE BACKGROUND: Digital Grid Pattern */
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px;
            position: relative;
        }

        /* Cahaya di belakang card (Glow) */
        body::before {
            content: '';
            position: absolute;
            top: 20%; left: 50%; transform: translateX(-50%);
            width: 500px; height: 500px;
            background: var(--glow-main);
            filter: blur(250px);
            opacity: 0.15;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 15px var(--glow-dim);
            backdrop-filter: blur(15px);
            animation: fadeIn 0.8s ease;
        }

        /* LOGO DIPERBESAR & GLOW PULSE */
        .header-brand {
            text-align: center;
            margin-bottom: 30px;
            animation: logoPulse 4s infinite alternate;
        }

        .header-brand i {
            font-size: 48px; /* Diperbesar */
            color: var(--glow-main);
            text-shadow: 0 0 15px var(--glow-main);
        }

        .header-brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px; /* Diperbesar */
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            margin-top: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--glow-main);
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 15px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        input[type="url"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 15px 12px 42px;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            height: 44px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--glow-main);
            box-shadow: 0 0 10px var(--glow-dim);
            background: rgba(99, 102, 241, 0.03);
        }

        /* ============================================== */
        /* UI: CUSTOM DROPDOWN (PILIH RESOLUSI) */
        /* ============================================== */
        .select-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0 15px;
            height: 44px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .select-row:hover {
            border-color: rgba(255,255,255,0.3);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .select-row:focus-within {
            border-color: var(--glow-main);
            box-shadow: 0 0 10px var(--glow-dim);
            background: rgba(99, 102, 241, 0.03);
        }

        .select-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        
        .select-content i {
            font-size: 18px;
            color: var(--text-muted);
        }
        
        .select-row .arrow-icon {
            font-size: 16px;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }
        
        .select-row:focus-within .arrow-icon {
            transform: rotate(180deg);
            color: var(--glow-main);
        }

        /* Sliding Panel (Preset Perangkat) */
        .preset-panel {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--bg-card);
            border-top: 1px solid var(--border-glow);
            border-top-left-radius: 16px; border-top-right-radius: 16px;
            z-index: 1000;
            transform: translateY(100%); /* Hidden by default */
            transition: transform 0.3s ease-out;
            padding: 25px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5), 0 0 15px var(--glow-dim);
        }
        
        .preset-panel.active {
            transform: translateY(0); /* Visible */
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        
        .panel-header h3 {
            font-size: 16px;
            font-weight: 700;
        }
        
        .close-panel-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }
        .close-panel-btn:hover { color: #fff; }

        .preset-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .preset-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }
        
        .preset-item:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        
        .preset-item.selected {
            border-color: var(--glow-main);
            background: rgba(99, 102, 241, 0.05);
            color: var(--glow-main);
            box-shadow: 0 0 10px var(--glow-dim);
        }
        
        .preset-item i { font-size: 18px; color: var(--text-muted); }
        .preset-item.selected i { color: var(--glow-main); }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .checkbox-wrapper input {
            appearance: none;
            width: 18px; height: 18px;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }
        .checkbox-wrapper input:checked {
            border-color: var(--glow-main);
            background-color: var(--glow-main);
            box-shadow: 0 0 8px var(--glow-dim);
        }
        .checkbox-wrapper input:checked::after {
            content: 'ri-check-line'; font-family: 'remixicon'; font-size: 14px;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #000; font-weight: bold;
        }

        /* Tombol Utama (Glow) */
        .btn {
            width: 100%;
            background: linear-gradient(135deg, var(--glow-main) 0%, #0072ff 100%);
            color: #000;
            border: none;
            height: 48px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0, 114, 255, 0.4);
        }

        .btn:hover {
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }
        .btn:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; transform: none; }

        .loader {
            width: 18px; height: 18px;
            border: 3px solid rgba(0,0,0,0.3); border-top-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes logoPulse { 0% { opacity: 1; } 100% { opacity: 0.8; filter: drop-shadow(0 0 20px var(--glow-main)); } }

        /* Area Hasil Screenshot */
        #result-area {
            display: none;
            margin-top: 30px;
            border-top: 1px dashed rgba(255,255,255,0.1);
            padding-top: 25px;
            animation: fadeIn 0.5s ease;
        }

        .img-container { 
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 10px; 
            background: rgba(0,0,0,0.4);
            text-align: center; 
            box-shadow: 0 0 15px var(--glow-dim);
        }
        .img-container img { max-width: 100%; display: block; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }

        .btn-success {
            background: transparent;
            color: var(--glow-main);
            border: 1px solid var(--glow-main);
            box-shadow: none;
            margin-top: 20px;
        }
        .btn-success:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 15px var(--glow-dim);
        }

        /* Overlay buat nutup panel */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            display: none;
        }

        /* ================= FOOTER REQUEST KHUSUS ================= */
        footer {
            margin-top: 40px;
            text-align: center;
            width: 100%;
            max-width: 480px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* 1. POWERED BY (Pindah ke atas tombol) */
        .powered-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .powered-text strong {
            color: var(--text-main);
            font-weight: 700;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        /* 2. Tombol Join Saluran */
        .join-channel-box { margin-bottom: 25px; }
        .btn-join-saluran {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid var(--glow-main);
            color: var(--glow-main);
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--glow-dim);
        }
        .btn-join-saluran:hover {
            background: var(--glow-main);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transform: scale(1.03);
        }

        /* 3. Icon Sosmed biasa */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .social-links a {
            color: var(--text-muted);
            font-size: 22px;
            text-decoration: none;
            transition: 0.2s;
        }
        .social-links a:hover { color: #fff; transform: translateY(-3px); }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .container { padding: 25px 20px; }
            .header-brand h1 { font-size: 20px; }
            .header-brand i { font-size: 40px; }
            .preset-list { max-height: 200px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <div class="container">
        <div class="header-brand">
            <i class="ri-radar-fill"></i>
            <h1>WEB CAPTURE</h1>
        </div>

        <form id="ss-form">
            <div class="form-group">
                <label>URL TARGET</label>
                <div class="input-wrapper">
                    <i class="ri-links-line"></i>
                    <input type="url" id="url" placeholder="https://domain-target.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>PILIH PERANGKAT (RESOLUSI)</label>
                <div class="select-row" id="select-preset-row" tabindex="0">
                    <div class="select-content" id="selected-device-content">
                        <i class="ri-computer-line" id="selected-icon"></i>
                        <span id="selected-text">PILIH PRESET</span>
                    </div>
                    <i class="ri-arrow-down-s-line arrow-icon"></i>
                </div>
            </div>

            <input type="hidden" id="width" value="1920">
            <input type="hidden" id="height" value="1080">
            <input type="hidden" id="device_scale" value="1">
            <input type="hidden" id="custom_active" value="false">

            <div class="form-group">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="fullpage">
                    <span>Full Page Capture</span>
                </label>
            </div>

            <button type="submit" id="submit-btn" class="btn">
                <span id="btn-text">INITIALIZE CAPTURE</span>
                <i class="ri-radar-line" id="btn-icon"></i>
                <div class="loader" id="loader"></div>
            </button>
        </form>

        <div id="result-area">
            <div class="img-container">
                <img id="result-img" src="" alt="Hasil Render">
            </div>
            <button id="download-btn" class="btn btn-success">
                <i class="ri-download-cloud-3-line"></i> SIMPAN HASIL RENDER
            </button>
        </div>
    </div>

    <div class="preset-panel" id="preset-panel">
        <header class="panel-header">
            <h3>Pilih Preset Perangkat (HD)</h3>
            <button class="close-panel-btn" id="close-panel-btn"><i class="ri-close-line"></i></button>
        </header>
        <ul class="preset-list">
            <li class="preset-item" data-w="375" data-h="812" data-s="2" data-n="Mobile (iPhone X HD)"><i class="ri-smartphone-line"></i> Mobile (iPhone X HD)</li>
            <li class="preset-item" data-w="768" data-h="1024" data-s="2" data-n="Tablet (iPad Air HD)"><i class="ri-tablet-line"></i> Tablet (iPad Air HD)</li>
            <li class="preset-item" data-w="1366" data-h="768" data-s="1" data-n="Laptop (Standard)"><i class="ri-macbook-line"></i> Laptop (Standard)</li>
            <li class="preset-item" data-w="1920" data-h="1080" data-s="1" data-n="PC Full HD (1080p)"><i class="ri-computer-line"></i> PC Full HD (1080p)</li>
            <li class="preset-item" data-w="3840" data-h="2160" data-s="1" data-n="PC Ultra 4K HD"><i class="ri-tv-2-line"></i> PC Ultra 4K HD)</li>
        </ul>
    </div>

    <footer>
        <div class="powered-text">
            POWERED BY <strong>R_hmt ofc</strong>
        </div>

        <div class="join-channel-box">
            <a href="https://whatsapp.com/channel/0029VbBjyjlJ93wa6hwSWa0p" target="_blank" class="btn-join-saluran">
                <i class="ri-whatsapp-fill"></i> JOIN SALURAN WHATSAPP
            </a>
        </div>

        <div class="social-links">
            <a href="https://www.instagram.com/rahmt_nhw?igsh=MWQwcnB3bTA2ZnVidg==" target="_blank"><i class="ri-instagram-line"></i></a>
            <a href="https://www.tiktok.com/@r_hmtofc?_r=1&_t=ZS-94KRfWQjeUu" target="_blank"><i class="ri-tiktok-fill"></i></a>
            <a href="https://t.me/rAi_engine" target="_blank"><i class="ri-telegram-fill"></i></a>
        </div>
    </footer>

    <script>
        // ================= LOGIKA UI: SLIDING PRESET PANEL =================
        const selectPresetRow = document.getElementById('select-preset-row');
        const presetPanel = document.getElementById('preset-panel');
        const overlay = document.getElementById('overlay');
        const closePanelBtn = document.getElementById('close-panel-btn');
        const presetItems = document.querySelectorAll('.preset-item');
        
        // Hidden inputs
        const wInput = document.getElementById('width');
        const hInput = document.getElementById('height');
        const sInput = document.getElementById('device_scale');
        
        // UI Display
        const selectedText = document.getElementById('selected-text');
        const selectedIcon = document.getElementById('selected-icon');

        // Buka panel
        selectPresetRow.addEventListener('click', () => {
            overlay.style.display = 'block';
            setTimeout(() => presetPanel.classList.add('active'), 10);
        });

        // Tutup panel
        const closePanel = () => {
            presetPanel.classList.remove('active');
            setTimeout(() => overlay.style.display = 'none', 300);
        };
        closePanelBtn.addEventListener('click', closePanel);
        overlay.addEventListener('click', closePanel);

        // Pilih Item
        presetItems.forEach(item => {
            item.addEventListener('click', () => {
                // Ambil data
                const w = item.dataset.w;
                const h = item.dataset.h;
                const s = item.dataset.s;
                const n = item.dataset.n;
                const iconClass = item.querySelector('i').className;

                // Update input
                wInput.value = w;
                hInput.value = h;
                sInput.value = s;

                // Update UI Display
                selectedText.textContent = n;
                selectedIcon.className = iconClass;
                selectedIcon.style.color = "var(--glow-main)"; // Neon

                // Reset Selected Style di list
                presetItems.forEach(pi => pi.classList.remove('selected'));
                item.classList.add('selected');

                closePanel();
            });
        });

        // Set default aktif (PC FHD)
        presetItems[3].click();


        // ================= LOGIKA API CAPTURE (BAWAAN LU, JALAN) =================
        const API_URL = '/api/screenshot';
        const form = document.getElementById('ss-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('result-area');
        const resultImg = document.getElementById('result-img');
        const downloadBtn = document.getElementById('download-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            btnText.textContent = 'INITIALIZING...';
            btnIcon.style.display = 'none';
            loader.style.display = 'block';
            resultArea.style.display = 'none';

            const payload = {
                url: document.getElementById('url').value,
                width: parseInt(wInput.value) || 1280,
                height: parseInt(hInput.value) || 720,
                device_scale: parseInt(sInput.value) || 1,
                full_page: document.getElementById('fullpage').checked
            };

            try {
                // Request ke Backend API asli lu (Axios di server)
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    resultImg.src = data.image_url;
                    resultArea.style.display = 'block';
                    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    alert('Error: ' + (data.message || 'Coba lagi bro.'));
                }

            } catch (error) {
                console.error('Fetch Error:', error);
                alert('Kesalahan koneksi API.');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'INITIALIZE CAPTURE';
                btnIcon.style.display = 'inline-block';
                loader.style.display = 'none';
            }
        });

        // ================= LOGIKA DOWNLOAD ASLI (TETAP AMAN) =================
        downloadBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const imageUrl = resultImg.src;
            if (!imageUrl) return;

            const originalHTML = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<div class="loader" style="display:inline-block; border-color: var(--text-main); border-top-color: transparent;"></div>';
            
            try {
                // BALIK KE FUNGSI ASLI LU, JALAN TANPA PROXY JS
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                const tempUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = tempUrl;
                a.download = `capture-${new Date().getTime()}.png`;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(tempUrl);
            } catch (err) {
                console.error("Gagal auto-download, fallback ke tab baru", err);
                window.open(imageUrl, '_blank'); 
            } finally {
                downloadBtn.innerHTML = originalHTML;
            }
        });
    </script>
</body>
    </html>
